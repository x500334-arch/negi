<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Video</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Georgia, serif;
      background: #120a1f;
      color: #fff3f7;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      margin: 0;
      padding: 2rem;
      box-sizing: border-box;
      background: radial-gradient(circle at top, #4b2351, #120a1f 70%);
      text-align: center;
    }

    main {
      width: min(900px, 100%);
    }

    h1 {
      margin-top: 0;
      font-size: clamp(2rem, 6vw, 4rem);
    }

    video {
      width: 100%;
      display: block;
      border: 1px solid rgba(255, 217, 138, .5);
      border-radius: 12px;
      box-shadow: 0 20px 70px rgba(0, 0, 0, .45);
    }
  </style>
</head>
<body>
  <main>
    <h1>A little something for you</h1>
    <video controls autoplay playsinline>
      <source src="birthday-video.mp4" type="video/mp4">
      Your browser does not support the video element.
    </video>
  </main>
</body>
</html>
