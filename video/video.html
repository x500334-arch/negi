<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Midnight Movie</title>
    <style>
        :root {
            --obsidian: #0B0E17;
            --navy: #11172A;
            --fuchsia: #E040FB;
            --gold: #FFD54F;
            --lavender: #9FA8DA;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-width: 320px;
            min-height: 100vh;
            overflow: hidden;
            color: #fff;
            font-family: Georgia, 'Times New Roman', serif;
            background: var(--obsidian);
        }

        .video-page {
            position: relative;
            min-height: 100vh;
            display: grid;
            place-items: center;
            isolation: isolate;
            padding: 2rem 1rem 4rem;
            text-align: center;
            background:
                radial-gradient(circle at 50% 48%, rgba(224, 64, 251, 0.13), transparent 38%),
                linear-gradient(145deg, var(--obsidian), var(--navy) 55%, #080A11);
        }

        .stars,
        .stars::before,
        .stars::after {
            position: absolute;
            inset: 0;
            z-index: -1;
            content: '';
            pointer-events: none;
            background-image:
                radial-gradient(circle, rgba(255, 255, 255, 0.85) 0 1px, transparent 1.5px),
                radial-gradient(circle, rgba(255, 213, 79, 0.75) 0 1px, transparent 1.5px);
            background-size: 125px 145px, 190px 210px;
            background-position: 12px 30px, 75px 100px;
            animation: drift 18s linear infinite;
            opacity: 0.55;
        }

        .stars::before {
            transform: scale(1.2);
            animation-duration: 28s;
            opacity: 0.25;
        }

        .stars::after {
            transform: scale(0.8);
            animation-direction: reverse;
            animation-duration: 22s;
            opacity: 0.35;
        }

        @keyframes drift {
            from { transform: translate3d(0, 0, 0); }
            to { transform: translate3d(-60px, 45px, 0); }
        }

        .theater-shell {
            width: min(92vw, 760px);
            padding: clamp(1.25rem, 4vw, 2.6rem);
            border: 1px solid rgba(224, 64, 251, 0.55);
            border-radius: 28px;
            background: rgba(17, 23, 42, 0.58);
            box-shadow: 0 0 0 1px rgba(159, 168, 218, 0.14),
                0 0 50px rgba(224, 64, 251, 0.2),
                inset 0 0 40px rgba(11, 14, 23, 0.7);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            transition: opacity 0.5s ease, filter 0.5s ease;
        }

        .eyebrow {
            margin: 0 0 0.5rem;
            color: var(--gold);
            font: 600 0.72rem/1.2 Arial, sans-serif;
            letter-spacing: 0.28em;
            text-transform: uppercase;
        }

        .video-page h1 {
            margin: 0 0 1.5rem;
            color: #fff;
            font-size: clamp(1.7rem, 4vw, 2.5rem);
            font-weight: 400;
            text-shadow: 0 0 18px rgba(224, 64, 251, 0.7);
        }

        .video-frame {
            position: relative;
            width: min(70vw, 510px);
            margin: 0 auto;
            padding: 9px;
            border: 1px solid rgba(255, 213, 79, 0.6);
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(224, 64, 251, 0.85), rgba(159, 168, 218, 0.5));
            box-shadow: 0 0 20px rgba(224, 64, 251, 0.65), 0 0 70px rgba(224, 64, 251, 0.2);
        }

        .video-circle {
            width: 100%;
            aspect-ratio: 1;
            display: block;
            object-fit: cover;
            border-radius: 50%;
            background: var(--obsidian);
        }

        .video-controls {
            display: flex;
            justify-content: center;
            gap: 0.8rem;
            margin-top: 1.3rem;
        }

        .sparkle-button {
            width: 52px;
            height: 52px;
            border: 1px solid rgba(255, 213, 79, 0.75);
            color: var(--gold);
            cursor: pointer;
            clip-path: polygon(50% 0%, 61% 36%, 100% 50%, 61% 64%, 50% 100%, 39% 64%, 0% 50%, 39% 36%);
            background: rgba(224, 64, 251, 0.22);
            filter: drop-shadow(0 0 8px rgba(224, 64, 251, 0.7));
            font-size: 1.25rem;
            transition: transform 0.25s ease, background 0.25s ease;
        }

        .sparkle-button:hover,
        .sparkle-button:focus-visible {
            transform: scale(1.12) rotate(8deg);
            outline: none;
            background: rgba(224, 64, 251, 0.55);
        }

        .return-button {
            margin-top: 1.2rem;
            padding: 0.7rem 1.2rem;
            border: 1px solid rgba(255, 213, 79, 0.65);
            border-radius: 999px;
            color: #fff;
            cursor: pointer;
            background: rgba(224, 64, 251, 0.2);
            font: 600 0.78rem Arial, sans-serif;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            transition: transform 0.25s ease, background 0.25s ease;
        }

        .return-button:hover,
        .return-button:focus-visible {
            transform: translateY(-2px);
            outline: none;
            background: rgba(224, 64, 251, 0.5);
        }

        .dim-button {
            position: absolute;
            right: 1.25rem;
            bottom: 1.25rem;
            padding: 0.65rem 0.9rem;
            border: 1px solid rgba(159, 168, 218, 0.45);
            border-radius: 999px;
            color: var(--lavender);
            cursor: pointer;
            background: rgba(11, 14, 23, 0.7);
            font: 0.72rem Arial, sans-serif;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .dimmed .theater-shell { opacity: 0.3; filter: brightness(0.45); }
        .dimmed .dim-button { opacity: 1; color: var(--gold); }

        @media (max-width: 520px) {
            .video-frame { width: min(78vw, 390px); }
            .dim-button { right: 0.75rem; bottom: 0.75rem; }
        }
    </style>
</head>
<body>
    <main class="video-page" id="movie-theater">
        <div class="stars" aria-hidden="true"></div>
        <section class="theater-shell" aria-label="Midnight movie player">
            <p class="eyebrow">Tonight's screening</p>
            <h1>Here is your video</h1>
            <div class="video-frame">
                <video class="video-circle" id="movie" autoplay muted loop playsinline>
                    <source src="video.mp4" type="video/mp4">
                    Your browser does not support HTML5 video.
                </video>
            </div>
            <div class="video-controls">
                <button class="sparkle-button" id="play-toggle" type="button" aria-label="Pause video">||</button>
            </div>
            <button class="return-button" id="return-button" type="button">Return to birthday page</button>
        </section>
        <button class="dim-button" id="dim-toggle" type="button" aria-pressed="false">Lights off</button>
    </main>
    <script>
        const movie = document.getElementById('movie');
        const playToggle = document.getElementById('play-toggle');
        const theater = document.getElementById('movie-theater');
        const dimToggle = document.getElementById('dim-toggle');
        const returnButton = document.getElementById('return-button');

        returnButton.addEventListener('click', () => {
            window.location.href = '../index.html';
        });

        playToggle.addEventListener('click', () => {
            if (movie.paused) {
                movie.play();
                playToggle.textContent = '||';
                playToggle.setAttribute('aria-label', 'Pause video');
            } else {
                movie.pause();
                playToggle.textContent = '▶';
                playToggle.setAttribute('aria-label', 'Play video');
            }
        });

        dimToggle.addEventListener('click', () => {
            theater.classList.toggle('dimmed');
            const isDimmed = theater.classList.contains('dimmed');
            dimToggle.setAttribute('aria-pressed', String(isDimmed));
            dimToggle.textContent = isDimmed ? 'Lights on' : 'Lights off';
        });
    </script>
</body>
</html>
